<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaposvár UV</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#eef2f5;
padding:15px;
margin:0;
}

.box{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 3px 10px #ccc;
}

h2,h3{
text-align:center;
}

#uv{
font-size:50px;
font-weight:bold;
text-align:center;
}

.info{
text-align:center;
color:#666;
}

.normal{
color:green;
}

.medium{
color:orange;
}

.high{
color:red;
}

.extreme{
color:purple;
}

.warning{
background:#ffd6d6;
color:#b00000;
padding:15px;
border-radius:12px;
text-align:center;
font-weight:bold;
margin-top:15px;
}

.day{
display:flex;
justify-content:space-between;
background:#f2f2f2;
padding:12px;
margin:8px 0;
border-radius:10px;
}

.hour{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #ddd;
}

#grafikon{
width:100%!important;
height:300px!important;
}

</style>

</head>


<body>


<div class="box">

<h2>☀️ Kaposvár UV-index</h2>

<div id="uv">
Betöltés...
</div>

<div id="info" class="info"></div>

<div id="warning"></div>

</div>



<div class="box">

<h3>📅 Következő napok</h3>

<div id="days"></div>

</div>



<div class="box">

<h3>🕒 Mai órás UV</h3>

<div id="hours"></div>

</div>



<div class="box">

<h3>📈 UV grafikon</h3>

<canvas id="grafikon"></canvas>

</div>




<script>


const API =
"https://api.open-meteo.com/v1/forecast?latitude=46.3594&longitude=17.7968&hourly=uv_index&daily=uv_index_max&timezone=Europe%2FBudapest";


let uvChart;



function osztaly(uv){

if(uv<3)return "normal";

if(uv<6)return "medium";

if(uv<8)return "high";

return "extreme";

}



function betoltes(){


fetch(API)

.then(r=>r.json())

.then(data=>{


let most=new Date();

let aktualis=0;



for(let i=0;i<data.hourly.time.length;i++){

let ido=new Date(data.hourly.time[i]);


if(
ido.getDate()==most.getDate()
&&
ido.getHours()==most.getHours()
){

aktualis=data.hourly.uv_index[i];

break;

}

}



document.getElementById("uv").innerHTML=

`
<span class="${osztaly(aktualis)}">
${aktualis.toFixed(1)}
</span>
<br>
<small>jelenlegi UV</small>
`;



document.getElementById("info").innerHTML=

"Frissítve: "+
new Date().toLocaleString("hu-HU");





if(aktualis>=6){

document.getElementById("warning").innerHTML=

`
<div class="warning">
⚠️ Erős UV sugárzás!<br>
UV-index: ${aktualis.toFixed(1)}
</div>
`;

}else{

document.getElementById("warning").innerHTML="";

}





let napok="";


for(let i=0;i<data.daily.time.length;i++){

let datum=new Date(data.daily.time[i]);

let uv=data.daily.uv_index_max[i];


napok+=`

<div class="day">

<span>
${datum.toLocaleDateString("hu-HU",
{
weekday:"short",
month:"short",
day:"numeric"
})}
</span>

<b class="${osztaly(uv)}">
${uv}
</b>

</div>

`;

}


document.getElementById("days").innerHTML=napok;





let orak="";

let idok=[];

let ertekek=[];



for(let i=0;i<data.hourly.time.length;i++){

let ido=new Date(data.hourly.time[i]);


if(ido.getDate()==most.getDate()){


let uv=data.hourly.uv_index[i];


idok.push(
ido.getHours()+":00"
);


ertekek.push(uv);



orak+=`

<div class="hour">

<span>
${ido.getHours()}:00
</span>

<b class="${osztaly(uv)}">
${uv}
</b>

</div>

`;

}

}


document.getElementById("hours").innerHTML=orak;






if(uvChart){

uvChart.destroy();

}



uvChart=new Chart(

document.getElementById("grafikon"),

{

type:"line",


data:{

labels:idok,


datasets:[

{

label:"UV-index",

data:ertekek,

borderWidth:3,

tension:0.3,

fill:true

},


{

label:"Erős UV határ (6)",

data:idok.map(()=>6),

borderWidth:2,

borderDash:[8,8],

pointRadius:0

}

]

},


options:{

responsive:true,

maintainAspectRatio:false,


scales:{

y:{

beginAtZero:true,

suggestedMax:10,

title:{

display:true,

text:"UV"

}

},


x:{

title:{

display:true,

text:"Idő"

}

}

}


}

}

);



})


.catch(e=>{


document.getElementById("uv").innerHTML="Hiba";

document.getElementById("info").innerHTML=e.message;


});


}



betoltes();


setInterval(betoltes,1800000);


</script>


</body>
</html>
